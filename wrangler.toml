name = "wakanda-guild"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Depois de rodar `wrangler d1 create wakanda-guild-db` (ou criar pelo
# painel da Cloudflare), cole o database_id aqui embaixo.
[[d1_databases]]
binding = "DB"
database_name = "wakanda-guild-db"
database_id = "COLE_AQUI_O_ID_DO_BANCO"
