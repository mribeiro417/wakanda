  function updateHistoricoList(){
    var container = document.getElementById('historico-list');
    if(!container) return;
    var filterSel = document.getElementById('historico-member-filter');
    var filterId = filterSel ? filterSel.value : 'todos';

    if(state.events.length === 0){
      container.innerHTML = '<div class="empty-msg">Nenhum evento registrado ainda.</div>';
      return;
    }

    var html = '';

    if(filterId !== 'todos'){
      var member = state.members.find(function(m){ return m.id === filterId; });
      if(member){
        var attendedCount = state.events.filter(function(ev){ return ev.attendees.indexOf(member.id) !== -1; }).length;
        var totalEv = state.events.length;
        var missed = totalEv - attendedCount;
        var pct = totalEv ? Math.round((attendedCount/totalEv)*100) : 0;
        html += '<div class="hist-member-summary">'+esc(member.name)+' participou de <strong>'+attendedCount+'/'+totalEv+'</strong> eventos ('+pct+'%) · faltou em <strong>'+missed+'</strong></div>';

        var prizes = getMemberPrizes(member.id);
        html += '<div class="hist-prizes">';
        html += '<div class="hist-col-title">Prêmios ganhos ('+prizes.length+')</div>';
        if(prizes.length === 0){
          html += '<div class="empty-msg" style="padding:4px 0;">Nenhum prêmio ganho ainda.</div>';
        } else {
          prizes.forEach(function(p){
            html += '<div class="hist-prize-item"><span>🏆 '+esc(p.prize||'(sem nome)')+'</span><span class="hist-prize-date">'+esc(p.date)+'</span>'+
              '<span class="pay-toggle '+(p.paid?'paid':'pending')+'" data-toggle-paid="'+p.drawId+'|'+p.idx+'">'+(p.paid?'✓ Pago':'Pendente')+'</span></div>';
          });
        }
        html += '</div>';
      }
    }

    state.events.forEach(function(ev){
      var absentMembers = state.members.filter(function(m){ return isActive(m) && ev.attendees.indexOf(m.id) === -1; });
      var presentMembers = state.members.filter(function(m){ return ev.attendees.indexOf(m.id) !== -1; });
      var isOpen = openHistoricoEventId === ev.id;

      html += '<div class="hist-card">';
      html += '<div class="hist-head" data-toggle-hist="'+ev.id+'">';
      html += '<span class="event-type-dot"></span>';
      html += '<div class="event-info">';
      html += '<div class="event-name">'+esc(ev.name)+'</div>';
      html += '<div class="event-meta">'+esc(ev.date)+' · '+esc(ev.type)+(ev.result==='derrota'&&ev.enemyGuild?' · perdeu para '+esc(ev.enemyGuild):'')+'</div>';
      html += '</div>';
      if(ev.result === 'vitoria') html += '<span class="event-badge vitoria" title="Vitória">🏆<br>VIT</span>';
      if(ev.result === 'derrota') html += '<span class="event-badge derrota" title="Derrota'+(ev.enemyGuild?' vs '+esc(ev.enemyGuild):'')+'">💀<br>DER</span>';

      if(filterId === 'todos'){
        html += '<span class="hist-counts">'+presentMembers.length+' presentes · '+absentMembers.length+' ausentes</span>';
      } else {
        var attended = ev.attendees.indexOf(filterId) !== -1;
        html += '<span class="hist-flag '+(attended?'presente':'ausente')+'">'+(attended?'Presente':'Ausente')+'</span>';
      }
      html += '<span class="chevron'+(isOpen?' open':'')+'">&#9656;</span>';
      html += '</div>';

      if(filterId === 'todos'){
        html += '<div class="hist-body'+(isOpen?' open':'')+'">';
        html += '<div class="hist-col"><div class="hist-col-title">Presentes ('+presentMembers.length+')</div>';
        html += presentMembers.length
          ? presentMembers.map(function(m){ return '<span class="hist-chip presente">'+esc(m.name)+'</span>'; }).join('')
          : '<div class="empty-msg" style="padding:4px 0;">Ninguém</div>';
        html += '</div>';
        html += '<div class="hist-col"><div class="hist-col-title">Ausentes ('+absentMembers.length+')</div>';
        html += absentMembers.length
          ? absentMembers.map(function(m){ return '<span class="hist-chip ausente">'+esc(m.name)+'</span>'; }).join('')
          : '<div class="empty-msg" style="padding:4px 0;">Ninguém — presença completa!</div>';
        html += '</div>';
        html += '</div>';
      }
      html += '</div>';
    });

    container.innerHTML = html;

    container.querySelectorAll('[data-toggle-hist]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = this.getAttribute('data-toggle-hist');
        openHistoricoEventId = (openHistoricoEventId === id) ? null : id;
        updateHistoricoList();
      });
    });

    attachPayToggleListeners(container);
  }

  window.__muRerenderHistorico = function(){
    openHistoricoEventId = null;
    updateHistoricoList();
  };

  function getAllPrizeEntries(){
    var rows = [];
    state.draws.forEach(function(d){
      d.pairs.forEach(function(p, idx){
        rows.push({ drawId: d.id, idx: idx, date: d.date, source: d.source, eventId: d.eventId || null, winner: p.winner, prize: p.prize, paid: !!p.paid });
      });
    });
    return rows;
  }

  function renderPagamentosTab(){
    var all = getAllPrizeEntries();
    var pagos = all.filter(function(r){ return r.paid; }).length;
    var pendentes = all.length - pagos;

    var html = '';

    html += '<div class="panel">';
    html += '<div class="panel-title">Resumo</div>';
    html += '<div class="hist-summary-row">';
    html += '<div class="hist-summary-stat vitoria"><span class="num">'+pagos+'</span><span class="label">Pagos</span></div>';
    html += '<div class="hist-summary-stat derrota"><span class="num">'+pendentes+'</span><span class="label">Pendentes</span></div>';
    html += '<div class="hist-summary-stat"><span class="num">'+all.length+'</span><span class="label">Prêmios totais</span></div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-title">Buscar</div>';
    html += '<div class="row" style="margin-bottom:4px;">';
    html += '<select id="payments-member-filter" style="flex:1;min-width:160px;" onchange="window.__muRerenderPayments()">';
    html += '<option value="todos">Todos os membros</option>';
    state.members.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(m){
      html += '<option value="'+m.id+'">'+esc(m.name)+(isActive(m)?'':' (inativo)')+'</option>';
    });
    html += '</select>';
    html += '<select id="payments-event-filter" style="flex:1;min-width:160px;" onchange="window.__muRerenderPayments()">';
    html += '<option value="todos">Todos os eventos</option>';
    state.events.forEach(function(ev){
      html += '<option value="'+ev.id+'">'+esc(ev.name)+' — '+esc(ev.date)+'</option>';
    });
    html += '</select>';
    html += '<select id="payments-status-filter" style="flex:1;min-width:140px;" onchange="window.__muRerenderPayments()">';
    html += '<option value="todos">Todos os status</option>';
    html += '<option value="pendente">Pendentes</option>';
    html += '<option value="pago">Pagos</option>';
    html += '</select>';
    html += '</div>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<div class="panel-title">Prêmios</div>';
    html += '<div id="payments-list">'+renderPaymentsListHTML()+'</div>';
    html += '</div>';

    return html;
  }

  function renderPaymentsListHTML(){
    var memberSel = document.getElementById('payments-member-filter');
    var eventSel = document.getElementById('payments-event-filter');
    var statusSel = document.getElementById('payments-status-filter');
    var memberFilter = memberSel ? memberSel.value : 'todos';
    var eventFilter = eventSel ? eventSel.value : 'todos';
    var statusFilter = statusSel ? statusSel.value : 'todos';

    var rows = getAllPrizeEntries();

    if(memberFilter !== 'todos'){
      var name = getMemberName(memberFilter);
      rows = rows.filter(function(r){ return r.winner === name; });
    }
    if(eventFilter !== 'todos'){
      rows = rows.filter(function(r){ return r.eventId === eventFilter; });
    }
    if(statusFilter === 'pendente') rows = rows.filter(function(r){ return !r.paid; });
    if(statusFilter === 'pago') rows = rows.filter(function(r){ return r.paid; });

    if(rows.length === 0){
      return '<div class="empty-msg">Nenhum prêmio encontrado com esse filtro.</div>';
    }

    var html = '';
    rows.forEach(function(r){
      html += '<div class="pending-pay-row">';
      html += '<div class="pending-pay-info"><strong>'+esc(r.winner)+'</strong> — '+esc(r.prize||'(sem nome)');
      html += '<div class="pending-pay-meta">'+esc(r.date)+' · '+esc(r.source)+'</div></div>';
      html += '<span class="pay-toggle '+(r.paid?'paid':'pending')+'" data-toggle-paid="'+r.drawId+'|'+r.idx+'">'+(r.paid?'✓ Pago':'Pendente')+'</span>';
      html += '</div>';
    });
    return html;
  }

  function updatePaymentsList(){
    var container = document.getElementById('payments-list');
    if(!container) return;
    container.innerHTML = renderPaymentsListHTML();
    attachPayToggleListeners(container);
  }

  window.__muRerenderPayments = function(){
    updatePaymentsList();
  };

  function renderToolbar(){
    return '' +
    '<div class="toolbar">' +
      '<div class="row">' +
        '<button class="btn btn-arcane" id="export-btn">Exportar para Excel</button>' +
        '<button class="btn btn-ghost" id="refresh-btn" title="Buscar atualizações de outros membros">Atualizar</button>' +
        '<a class="btn btn-ghost" href="'+DRIVE_FOLDER_URL+'" target="_blank" rel="noopener">Abrir pasta do Drive</a>' +
        '<button class="btn btn-ghost" id="reset-btn">'+(pendingDelete && pendingDelete.kind==='all' ? 'Confirmar reinício' : 'Reiniciar dados')+'</button>' +
      '</div>' +
      '<div class="status-msg" id="status-msg"></div>' +
    '</div>';
  }

  function clearPendingSoon(){
    setTimeout(function(){ pendingDelete = null; render(); }, 3000);
  }

  function attachEvents(){
    var guildInput = document.getElementById('guild-name-input');
    if(guildInput){
      guildInput.addEventListener('change', function(){
        state.guildName = this.value.trim() || 'WAKANDA';
        saveData(true);
      });
    }

    attachPainelListeners();

    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        activeTab = this.getAttribute('data-tab');
        pendingDelete = null;
        render();
      });
    });

    var addMemberBtn = document.getElementById('add-member-btn');
    if(addMemberBtn){
      var doAdd = function(){
        var input = document.getElementById('new-member-input');
        addMember(input.value);
        input.value = '';
        render();
        var refocus = document.getElementById('new-member-input');
        if(refocus) refocus.focus();
      };
      addMemberBtn.addEventListener('click', doAdd);
      document.getElementById('new-member-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter') doAdd();
      });
    }

    document.querySelectorAll('[data-del-member]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = this.getAttribute('data-del-member');
        if(pendingDelete && pendingDelete.kind==='member' && pendingDelete.id===id){
          removeMember(id);
          pendingDelete = null;
        } else {
          pendingDelete = {kind:'member', id:id};
          render();
          clearPendingSoon();
        }
      });
    });

    var addEventBtn = document.getElementById('add-event-btn');
    if(addEventBtn){
      addEventBtn.addEventListener('click', function(){
        var type = document.getElementById('new-event-type').value;
        var date = document.getElementById('new-event-date').value;
        var name = document.getElementById('new-event-name').value.trim();
        var id = addEvent(name, type, date);
        openEventId = id;
        document.getElementById('new-event-name').value = '';
        render();
      });
    }

    document.querySelectorAll('[data-toggle-event]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = this.getAttribute('data-toggle-event');
        openEventId = (openEventId === id) ? null : id;
        pendingDelete = null;
        render();
      });
    });

    document.querySelectorAll('[data-toggle-attend]').forEach(function(el){
      el.addEventListener('click', function(){
        var parts = this.getAttribute('data-toggle-attend').split('|');
        toggleAttendance(parts[0], parts[1]);
      });
    });

    document.querySelectorAll('[data-toggle-loot]').forEach(function(el){
      el.addEventListener('click', function(){
        var parts = this.getAttribute('data-toggle-loot').split('|');
        toggleLoot(parts[0], parts[1]);
      });
    });

    document.querySelectorAll('[data-edit-member]').forEach(function(el){
      el.addEventListener('click', function(){
        editingMemberId = this.getAttribute('data-edit-member');
        pendingDelete = null;
        render();
        var inp = document.getElementById('edit-member-input');
        if(inp){ inp.focus(); inp.select(); }
      });
    });

    var saveEdit = function(id){
      var inp = document.getElementById('edit-member-input');
      if(!inp) return;
      if(renameMember(id, inp.value)){ editingMemberId = null; render(); }
      else { inp.focus(); }
    };
    document.querySelectorAll('[data-save-member]').forEach(function(el){
      el.addEventListener('click', function(){ saveEdit(this.getAttribute('data-save-member')); });
    });
    document.querySelectorAll('[data-cancel-edit]').forEach(function(el){
      el.addEventListener('click', function(){ editingMemberId = null; render(); });
    });
    var editInput = document.getElementById('edit-member-input');
    if(editInput){
      editInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter') saveEdit(this.getAttribute('data-edit-input'));
        if(e.key === 'Escape'){ editingMemberId = null; render(); }
      });
    }

    document.querySelectorAll('[data-toggle-active]').forEach(function(el){
      el.addEventListener('click', function(){ toggleActive(this.getAttribute('data-toggle-active')); });
    });

    document.querySelectorAll('[data-toggle-novato]').forEach(function(el){
      el.addEventListener('click', function(){
        toggleNovato(this.getAttribute('data-toggle-novato'));
      });
    });

    document.querySelectorAll('[data-set-result]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var parts = this.getAttribute('data-set-result').split('|');
        setEventResult(parts[0], parts[1]);
      });
    });

    document.querySelectorAll('[data-enemy-guild]').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); });
      el.addEventListener('change', function(){
        setEnemyGuild(this.getAttribute('data-enemy-guild'), this.value.trim());
      });
    });

    document.querySelectorAll('[data-del-event]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = this.getAttribute('data-del-event');
        if(pendingDelete && pendingDelete.kind==='event' && pendingDelete.id===id){
          removeEvent(id);
          pendingDelete = null;
        } else {
          pendingDelete = {kind:'event', id:id};
          render();
          clearPendingSoon();
        }
      });
    });

    document.querySelectorAll('[data-export-event]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        exportEventToExcel(this.getAttribute('data-export-event'));
      });
    });

    var exportBtn = document.getElementById('export-btn');
    if(exportBtn) exportBtn.addEventListener('click', exportToExcel);

    var refreshBtn = document.getElementById('refresh-btn');
    if(refreshBtn) refreshBtn.addEventListener('click', function(){ loadData(false); setStatus('Dados atualizados.'); });

    var resetBtn = document.getElementById('reset-btn');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        if(pendingDelete && pendingDelete.kind === 'all'){
          resetAll();
          pendingDelete = null;
        } else {
          pendingDelete = {kind:'all', id:null};
          render();
          clearPendingSoon();
        }
      });
    }

    if(activeTab === 'sorteio'){
      renderDrawSourceFields();
      var drawBtn = document.getElementById('draw-btn');
      if(drawBtn) drawBtn.addEventListener('click', startDraw);

      document.querySelectorAll('[data-weight-family]').forEach(function(el){
        el.addEventListener('change', function(){
          var fam = this.getAttribute('data-weight-family');
          var num = parseFloat(this.value);
          if(isNaN(num) || num < 0) num = 0;
          state.eventWeights[fam] = num;
          saveData(true);
          var sourceEl = document.getElementById('draw-source');
          if(sourceEl && sourceEl.value === 'pontuacao') updateScorePreview();
        });
      });

      document.querySelectorAll('[data-del-draw]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = this.getAttribute('data-del-draw');
          if(pendingDelete && pendingDelete.kind==='draw' && pendingDelete.id===id){
            removeDraw(id);
            pendingDelete = null;
          } else {
            pendingDelete = {kind:'draw', id:id};
            render();
            clearPendingSoon();
          }
        });
      });

      attachPayToggleListeners(document);
    }

    if(activeTab === 'ranking'){
      renderRankingPeriodInput();
      updateRankingResults();
    }

    if(activeTab === 'historico'){
      updateHistoricoList();
    }

    if(activeTab === 'pagamentos'){
      attachPayToggleListeners(document.getElementById('payments-list'));
    }
  }

  loadData();
})();
</script>
</body>
</html>
